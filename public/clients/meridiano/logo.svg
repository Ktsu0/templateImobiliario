<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 452 96" width="452" height="96" role="img" aria-label="Meridiano Imóveis">
  <!-- Demo client mark: a meridian — the line that fixes a place on the map.
       Colours and faces go through the theme's CSS variables, with the
       client's own values as fallbacks so the file still stands on its own
       when opened directly. They only resolve once the file is inlined into
       the page; inside an <img> the browser uses the fallbacks. -->
  <g fill="none" style="stroke: var(--brass, #B08D57)" stroke-width="2.4" stroke-linecap="round">
    <circle cx="44" cy="48" r="27" />
    <ellipse cx="44" cy="48" rx="11.5" ry="27" />
    <path d="M17.6 39.5h52.8M17.6 56.5h52.8" opacity=".65" />
    <path d="M44 12.5v71" style="stroke: var(--brass-light, #D9C7A3)" stroke-width="1.4" opacity=".55" />
  </g>

  <text x="92" y="55" font-size="38" font-weight="600" letter-spacing="0.4"
        style="font-family: var(--font-display), Fraunces, Georgia, serif; fill: var(--ivory, #F6F1E7)">Meridiano</text>
  <text x="94" y="80" font-size="13.5" letter-spacing="6.5"
        style="font-family: var(--font-body), Manrope, system-ui, sans-serif; fill: var(--brass-light, #D9C7A3)">IMÓVEIS</text>
</svg>
